# Prometheus + Grafana for the launcher site, on the load node.
# Prometheus scrapes per-container CPU and memory from each kubelet's cAdvisor (bench namespace
# only) and receives k6 latency/throughput through remote write. Storage is an emptyDir: the
# data lives as long as the pod, which is fine for a 1-2 day demo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bench-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bench-prometheus
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bench-prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: bench}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: bench
data:
  prometheus.yml: |
    global: {scrape_interval: 5s}
    scrape_configs:
      - job_name: cadvisor
        scheme: https
        authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
        tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - {target_label: __address__, replacement: kubernetes.default.svc:443}
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          - {source_labels: [namespace], regex: bench, action: keep}
          - {source_labels: [__name__], regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes, action: keep}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: bench
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      nodeSelector: {bench/load: "true"}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-remote-write-receiver
          ports:
            - containerPort: 9090
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          configMap: {name: prometheus}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: bench
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: bench
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, url: "http://prometheus:9090", isDefault: true, jsonData: {timeInterval: 5s}}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - {name: bench, type: file, options: {path: /var/lib/grafana/dashboards}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: bench
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      nodeSelector: {bench/load: "true"}
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          env:
            # Public, read-only: anonymous viewers, no login form, so no default admin/admin.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_SERVER_ROOT_URL, value: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/bench.json}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /grafana/api/health, port: 3000}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: bench
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /grafana/api/health
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000}
