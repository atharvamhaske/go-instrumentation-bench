# Trace backend. Lives on the load node so export cost is paid by the app (network + encoding),
# while storage and indexing never compete with the app for CPU.
apiVersion: v1
kind: Namespace
metadata:
  name: bench
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: bench
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      nodeSelector: {bench/load: "true"}
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          ports:
            - containerPort: 4318
            - containerPort: 16686
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: bench
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-http, port: 4318}
    - {name: ui, port: 16686}
